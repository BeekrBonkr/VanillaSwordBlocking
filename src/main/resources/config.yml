# ------------------------------------------------------------------------
#  VanillaSwordBlocking
#
#  Brings back 1.8-style sword blocking: right-click with a sword to block
#  and reduce incoming damage, with the classic blocking animation.
#
#  This plugin ONLY handles sword blocking. Install it alongside a plugin
#  like OldCombatMechanics to restore the rest of 1.8.9 combat (no attack
#  cooldown, old damage values, no sweep attacks, ...).
#
#  Every option's comment notes the authentic 1.8.9 value.
#  Apply changes without a restart: /vanillablocking reload
#  (alias: /vsb - permission: vanillablocking.admin)
# ------------------------------------------------------------------------

# Internal version of this file, used for automatic config updates.
# When a plugin update adds or changes options, your config is migrated
# automatically and a backup of your old file is kept next to it.
# Do not edit this value!
config-version: 2

# Master switch for the whole plugin.
enabled: true

damage-reduction:
  # How damage taken while blocking is reduced:
  #   legacy     - the exact 1.8.9 formula: damage = (damage + 1) / 2
  #                (a hit for 8.0 damage becomes 4.5, applied before armor)
  #   multiplier - a simple percentage: damage = damage * multiplier
  # Authentic 1.8.9 value: legacy
  formula: legacy

  # Fraction of damage still taken while blocking.
  # Only used when 'formula' is set to 'multiplier'.
  # 0.5 = take half damage, which is roughly what 1.8.9 did.
  multiplier: 0.5

# Knockback taken while blocking is multiplied by this value.
# Authentic 1.8.9 value: 1.0 (blocking never reduced knockback).
# Some 1.8-style PvP servers prefer values around 0.6-0.8.
knockback-multiplier: 1.0

block-hitting:
  # Block-hitting: attacking while blocking, the classic 1.8.9 PvP
  # technique. When true, attacking never interrupts your block.
  # Authentic 1.8.9 value: true
  enabled: true

  # Outgoing melee damage dealt while blocking is multiplied by this.
  # Authentic 1.8.9 value: 1.0 (block-hits dealt full damage).
  # Servers that want to soften block-hitting sometimes use ~0.8.
  attack-damage-multiplier: 1.0

  # Only used when 'enabled' is false: attacking interrupts the block and
  # prevents blocking again for this many ticks (20 ticks = 1 second).
  # Not applicable to 1.8.9 (block-hitting was always allowed).
  interrupt-ticks: 10

# The items that can be used to block. Two kinds of entries are supported:
#   "#namespace:tag"  - every item in an item tag, e.g. "#minecraft:swords"
#   "namespace:item"  - a single item,             e.g. "minecraft:trident"
# Datapack-added tags and items work too.
# Note: items that are already consumable on their own (food, potions,
# milk, ...) cannot be used for blocking and are skipped.
# Authentic 1.8.9 value: just the swords tag.
#
# Example - allow swords, all axes and the trident to block:
# blockable-items:
#   - "#minecraft:swords"
#   - "#minecraft:axes"
#   - "minecraft:trident"
blockable-items:
  - "#minecraft:swords"

# The damage causes that blocking protects against.
# The 1.8.9 rule was: any damage that armor reduces can also be blocked.
# The default list below reproduces that rule exactly on a modern server,
# so it is the authentic 1.8.9 setup:
#   melee hits, sweep attacks (didn't exist in 1.8.9, treated like melee -
#   OldCombatMechanics usually disables them anyway), projectiles,
#   explosions, standing in fire, lava, magma blocks, cactus contact,
#   falling anvils, lightning and thorns.
# Notable causes that were NOT blockable in 1.8.9 and are therefore not
# listed: FALL, FIRE_TICK (burning), MAGIC, POISON, WITHER, SUFFOCATION,
# DROWNING, STARVATION, VOID.
# All valid names:
# https://jd.papermc.io/paper/1.21.4/org/bukkit/event/entity/EntityDamageEvent.DamageCause.html
blockable-damage-causes:
  - ENTITY_ATTACK
  - ENTITY_SWEEP_ATTACK
  - PROJECTILE
  - ENTITY_EXPLOSION
  - BLOCK_EXPLOSION
  - FIRE
  - LAVA
  - HOT_FLOOR
  - CONTACT
  - FALLING_BLOCK
  - LIGHTNING
  - THORNS

restrictions:
  # Whether you can block while a shield is in your offhand.
  # If false, blocking items temporarily lose the ability to block while a
  # shield is held, so right-click raises the shield as usual. If true,
  # the sword blocks instead and the shield never raises.
  # 1.8.9 had no shields, so there is no authentic value; false gives the
  # most predictable behavior alongside modern items.
  allow-with-shield: false

  # Whether an item held in the offhand can block.
  # Authentic 1.8.9 value: false (1.8.9 had no offhand).
  allow-offhand: false

  # Blocking is completely disabled in these worlds:
  # no blocking animation and no damage reduction.
  # Example:
  # disabled-worlds:
  #   - creative_world
  disabled-worlds: []
